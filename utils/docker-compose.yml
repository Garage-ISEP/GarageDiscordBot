version: "3"
services:
  GarageDiscordBot:
    image: ghcr.io/garage-isep/garagediscordbot:latest
    container_name: GarageDiscordBot
    restart: always
    env_file:
      - .env
    volumes:
      - ./log:/bot/log
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3